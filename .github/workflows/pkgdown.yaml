# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - name: Recent GDAL (Ubuntu, ubuntugis-unstable PPA)
        run: |
          # Launchpad is intermittently unavailable, in two ways: its API can
          # fail while add-apt-repository fetches the signing key (HTTP 500),
          # and the archive can answer 503, which apt only warns about before
          # installing the distro GDAL (3.8) instead. That surfaces much later
          # as "garry needs GDAL >= 3.9". Retry both until the PPA index is
          # there, and fail here if the GDAL that got installed is still too old.
          for i in 1 2 3 4 5 6; do
            if sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable &&
              sudo apt-get update &&
              apt-cache policy libgdal-dev | grep -q launchpad; then
              break
            fi
            echo "ubuntugis PPA unavailable (attempt $i), retrying in 60 s"
            sleep 60
          done
          sudo apt-get install -y gdal-bin libgdal-dev libproj-dev libgeos-dev
          gdal_version=$(gdal-config --version)
          echo "GDAL $gdal_version"
          if ! dpkg --compare-versions "$gdal_version" ge 3.9; then
            echo "::error::GDAL $gdal_version installed, need >= 3.9: the ubuntugis PPA was not reachable"
            exit 1
          fi

      # terra=?ignore: pak's ignore parameter drops terra (soft dep)
      # entirely. Its CRAN binary links a GDAL soname the PPA install
      # above removes, and the site build never needs it: the only use
      # is the check_installed-guarded as_terra(), with no examples.
      # rstac=?ignore joins terra=?ignore: rstac hard-imports sf,
      # whose CRAN binary links the pre-PPA GDAL soname, and sf
      # cannot be ignored directly (hard dep). Neither package
      # executes at site build (no examples on the STAC pages;
      # vignettes are prerendered); downlit just skips their links.
      # cache-version 3: prefix-matched restore keys resurrect older
      # library caches that still contain the broken terra/sf
      # binaries, which downlit loadNamespace()s when autolinking.
      # Bumping orphans them; v3 builds never contain terra/rstac/sf.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3
          extra-packages: any::pkgdown, local::., terra=?ignore, rstac=?ignore, rustyfilters=?ignore
          needs: website

      # Force a source rebuild of dev gdalraster against the PPA GDAL
      # above: pak's cache can serve a binary linked against a GDAL
      # soname the runner no longer has (observed: libgdal.so.37
      # missing at site build). Mirrors the R-CMD-check step.
      - name: Rebuild dev gdalraster from source
        run: Rscript -e "install.packages('remotes', repos = 'https://cloud.r-project.org'); remotes::install_github('firelab/gdalraster@ba2827d7ec9c2284d760f6c2dee9c580462c87cc', force = TRUE)"

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
