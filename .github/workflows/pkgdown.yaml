# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - name: Recent GDAL (Ubuntu, ubuntugis-unstable PPA)
        run: |
          sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libproj-dev libgeos-dev

      # terra=?ignore: pak's ignore parameter drops terra (soft dep)
      # entirely. Its CRAN binary links a GDAL soname the PPA install
      # above removes, and the site build never needs it: the only use
      # is the check_installed-guarded as_terra(), with no examples.
      # cache-version 2: prefix-matched restore keys can resurrect a
      # pre-ignore library cache that still contains the broken terra
      # binary (downlit loadNamespace()s it when autolinking
      # as_terra.Rd). Bumping orphans those caches; v2 builds never
      # contain terra.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: any::pkgdown, local::., terra=?ignore
          needs: website

      # Force a source rebuild of dev gdalraster against the PPA GDAL
      # above: pak's cache can serve a binary linked against a GDAL
      # soname the runner no longer has (observed: libgdal.so.37
      # missing at site build). Mirrors the R-CMD-check step.
      - name: Rebuild dev gdalraster from source
        run: Rscript -e "install.packages('remotes', repos = 'https://cloud.r-project.org'); remotes::install_github('firelab/gdalraster', force = TRUE)"

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
