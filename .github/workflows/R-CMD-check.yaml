# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # A hung test otherwise burns the 6h job maximum (macOS fused-path
    # stall, runs 30854991920 / 30883748389). The R-level test timeout
    # below fires first so the check fails with partial test output.
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      PJRT_INSTALL: "1"          # let pjrt fetch the CPU plugin non-interactively
      # Kill a hung test run instead of stalling: R kills the process and
      # the check fails with the partial testthat.Rout in the artifact.
      # 90 min: the suite runs ~30-55 min per platform (macOS slowest on
      # 3 cores), so this only fires on a genuine wedge.
      _R_CHECK_TESTS_ELAPSED_TIMEOUT_: "5400"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      # garry's mosaic layer uses GDAL's GTI driver (>= 3.9). The distro/CRAN
      # default GDAL is older, so install a recent one BEFORE setup-r and rebuild
      # gdalraster against it below. Windows keeps its CRAN binary (already 3.9+).
      - name: Recent GDAL (macOS)
        if: runner.os == 'macOS'
        run: brew install gdal proj geos

      - name: Recent GDAL (Ubuntu, ubuntugis-unstable PPA)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libproj-dev libgeos-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          extra-repositories: https://r-xla.r-universe.dev

      - name: GDAL SRS source quirk (macOS)
        if: runner.os == 'macOS'
        run: echo "GTIFF_SRS_SOURCE=EPSG" >> $GITHUB_ENV

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Force a source rebuild of DEV gdalraster against the recent
      # system GDAL above: garry needs >= 2.6.1.9001 (exported
      # get_data_ptr, the DESCRIPTION Remotes pin), and pak's cache can
      # otherwise serve a build linked against a since-upgraded GDAL.
      # Windows keeps whatever the Remotes pin installed (Rtools GDAL).
      - name: Rebuild dev gdalraster from source (macOS/Linux)
        if: runner.os != 'Windows'
        run: Rscript -e "install.packages('remotes', repos = 'https://cloud.r-project.org'); remotes::install_github('firelab/gdalraster', force = TRUE)"

      - name: Print GDAL version
        run: Rscript -e "cat('GDAL:', gdalraster::gdal_version()[[1]], '\n')"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
