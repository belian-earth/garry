url: https://belian-earth.github.io/garry/
development:
  mode: auto
template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: '#74ac90ff'
navbar:
  structure:
    left:
    - reference
    - intro
    - articles
    - news
    right:
    - search
    - github
  components:
    github:
      icon: fa-github
      href: https://github.com/belian-earth/garry
reference:
- title: Discovery & sources
  desc: |
    Turn a STAC search into grid-pinned lazy rasters. Entry point for remote (Planetary Computer / element84) collections.
  contents:
  - stac_query
  - stac_sign_mpc
  - stac_sources
  - stac_filter_assets
  - stac_filter_cloud
  - stac_filter_coverage
  - stac_filter_orbit
  - stac_drop_duplicates
  - stac_rename_assets
  - stac_merge
  - stac_time_slices
  - stac_gti_index
  - lazy_stac_stack
  - lazy_source
- title: Datasets
  desc: |
    The named multi-band, multi-time object; verbs apply across every band. Build from a STAC table or from rasters, then select, stack, and collapse.
  contents:
  - lazy_dataset
  - as_dataset
  - LazyDataset
  - stack_bands
  - band_sel
  - time_sel
- title: Masking & cloud removal
  desc: |
    Mask value bands from a QA band or from a pre-trained cloud model. The ocm_* functions run the OmniCloudMask segmentation model natively (no Python) to derive cloud/shadow masks from red, green, and NIR bands.
  contents:
  - mask
  - qa_bits
  - ocm_mask
  - ocm_predict
  - ocm_model
  - ocm_fetch_weights
  - ocm_load_weights
  - shrink_footprint
- title: Time series & compositing
  desc: |
    Collapse or smooth the time axis: calendar grouping, multivariate composites, gap filling, and per-pixel smoothers.
  contents:
  - group_by_time
  - geomedian
  - medoid
  - fill_gaps
  - hampel_smooth
  - kalman_smooth
  - kalman_llt
- title: Geo-embeddings & model weights
  desc: |
    Special operations for published geo-embedding products: the quantiser decodes (fused onto multi-band reads via lazy_map) and safetensors weight IO.
  contents:
  - dequantize_aef
  - dequantize_esd
  - safetensors_read
  - safetensors_ls
- title: Raster & dataset algebra
  desc: |
    Lazily build and transform rasters and datasets. Every verb adds IR nodes and returns a new lazy object; nothing reads or computes until collect().
  contents:
  - lazy_map
  - lazy_stack
  - focal
  - focal_kernel
  - bilateral_focal
  - reduce_over
  - band_project
  - mlp_project
  - scan_over
  - lazy_patch
  - align
- title: Execution
  desc: Plan, distribute across daemons, and write the result.
  contents:
  - collect
  - write_tif
  - materialise
  - as_terra
  - garry_daemons
  - garry_daemons_set
  - garry_pool_hygiene
  - garry_gdal_config
  - garry_opt
  - garry_options
- title: Diagnostics & visualisation
  desc: |
    Inspect data and understand what an execution did: quick plots, pipeline drawings, and run reports.
  contents:
  - preview
  - draw
  - plan_view
  - garry_last_route
  - garry_task_report
  - garry_explain_placement
- title: Grids & spatial helpers
  desc: Define and interrogate the analysis grid; dtype rules.
  contents:
  - grid_spec
  - grid_from_bbox
  - grid_from_src
  - gdal_grid_spec
  - res
  - xmin
  - xmax
  - ymin
  - ymax
  - grid_equal
  - grid_diff
  - crs_equal
  - dtype_valid
  - dtype_promote
  - snap_to_blocks
  - output_grid
- title: anvl compute vocabulary
  desc: |
    The g_* traced-array ops for writing map/focal/reducer functions. These run fused inside an XLA stage under both the pure-R reference implementation and PJRT.
  contents:
  - g_ifelse
  - g_is_nodata
  - g_cast
  - g_fill
  - g_pad
  - g_pad_rb
  - g_shift_slice
  - g_stack
  - g_index_scalar
  - g_scan
  - g_slice_t
  - g_concat_t
  - g_rep_t
  - g_expand
  - g_squeeze1
  - g_transpose
  - g_bitand
  - g_bitor
  - g_bitxor
  - g_bitnot
  - g_shiftl
  - g_shiftr
  - g_sum
  - g_mean
  - g_min
  - g_max
  - g_median
  - g_count
  - g_erf
  - g_conv2d
  - g_upsample2x
  - g_broadcast_arrays
  - g_upload
  - g_download
  - lazy_value_and_grad
- title: GDAL adapter (low-level IO)
  desc: |
    Direct windowed read/write, warp, staging, and GTI index construction. Used by the cube layer; exposed for bespoke IO.
  contents:
  - gdal_read_window
  - gdal_write_window
  - gdal_create_output
  - gdal_warp_vrt
  - stage_raw_cube
  - gti_index_create
  - gti_open_options
- title: IR & planner (extension API)
  desc: |
    The intermediate representation and planner. Needed only to build on the IR directly (custom nodes, alternate executors) -- not for normal use.
  contents:
  - LazyRaster
  - GridSpec
  - Graph
  - ChunkGrid
  - Stage
  - Plan
  - Node
  - SourceNode
  - MapNode
  - FocalNode
  - ReduceNode
  - ScanNode
  - WarpNode
  - StackNode
  - FusedNode
  - PatchNode
  - graph_new
  - graph_add
  - graph_get
  - graph_ids
  - graph_toposort
  - graph_replace
  - graph_import
  - plan_lazy
  - plan_dot
  - execute_plan
  - execute_plan_mirai
  - fusable
  - is_barrier
  - required_halo
  - chunk_iter
  - chunk_window_with_halo
  - cross_grid_window
- title: internal
  desc: |
    Exported only so mirai daemons can call them across the process boundary, or as low-level plumbing. Not public API; do not depend on these.
  contents:
  - has_keyword("internal")
  - starts_with(".")
