[project]
name = "garry-benchmarks"
version = "0.1.0"
description = "Benchmark suite: garry against the Open Data Cube stack and Cubed"
requires-python = "==3.12.*"
dependencies = [
  "cubed>=0.28.0",
  "dask>=2026.8.0",
  "distributed>=2026.8.0",
  "numba>=0.68.1",
  "numbagg>=0.9.6,!=0.9.5",
  "numpy>=2.5.4",
  "odc-algo>=1.2.2",
  "odc-geo>=0.5.3",
  "odc-stac>=0.5.3",
  "pyproj>=3.8.0",
  "pystac>=1.15.2",
  "rasterio>=1.5.2",
  "rioxarray>=0.23.0",
  "scipy>=1.18.1",
  "simdkalman>=1.0.4",
  "xarray>=2026.9.0",
  "zarr>=3.4.2",
]

[tool.uv]
package = false
